version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=QuantumKernel AI
      - SECRET_KEY=quantum_secret_key_development_change_in_production
      - DATABASE_URL=sqlite:///./quantumkernel.db
    volumes:
      - sqlite_data:/app

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  sqlite_data:
