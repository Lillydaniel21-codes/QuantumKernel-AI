<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="overlapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="680" height="220" rx="16" fill="#070b18" stroke="#1e293b" stroke-width="1.5" />

  <!-- Input sample 1 (x) -->
  <rect x="25" y="35" width="130" height="65" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="90" y="60" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Vector x ∈ ℝⁿ</text>
  <text x="90" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Input Sample 1</text>

  <!-- Input sample 2 (y) -->
  <rect x="25" y="125" width="130" height="65" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
  <text x="90" y="150" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Vector y ∈ ℝⁿ</text>
  <text x="90" y="172" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Input Sample 2</text>

  <!-- Arrow to Unitary mapping -->
  <path d="M 160 67 L 205 67" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 160 157 L 205 157" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Quantum Encodings U(x)|0⟩ and U(y)|0⟩ -->
  <rect x="210" y="35" width="150" height="65" rx="10" fill="#0b1329" stroke="#06b6d4" stroke-width="1.8" />
  <text x="285" y="60" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">|Φ(x)⟩ = U(x)|0⟩</text>
  <text x="285" y="82" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">2ⁿ-Dim Hilbert State</text>

  <rect x="210" y="125" width="150" height="65" rx="10" fill="#140d29" stroke="#8b5cf6" stroke-width="1.8" />
  <text x="285" y="150" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">|Φ(y)⟩ = U(y)|0⟩</text>
  <text x="285" y="172" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">2ⁿ-Dim Hilbert State</text>

  <!-- Converging paths to overlap calculation -->
  <path d="M 365 67 C 395 67, 395 110, 420 110" fill="none" stroke="#06b6d4" stroke-width="2" />
  <path d="M 365 157 C 395 157, 395 110, 420 110" fill="none" stroke="#8b5cf6" stroke-width="2" />

  <!-- Overlap Fidelity Box -->
  <rect x="425" y="60" width="230" height="100" rx="12" fill="url(#overlapGrad)" stroke="#ec4899" stroke-width="2" />
  <text x="540" y="92" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">K(x, y) = |⟨Φ(x)|Φ(y)⟩|²</text>
  <text x="540" y="116" fill="#fbcfe8" font-family="sans-serif" font-size="11" text-anchor="middle">Quantum State Fidelity Overlap</text>
  <text x="540" y="138" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">Bounds: 0.0 ≤ K(x,y) ≤ 1.0</text>
</svg>
