<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="zzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect x="0" y="0" width="700" height="240" rx="16" fill="#090d1a" stroke="#1e293b" stroke-width="1.5" />

  <!-- Qubit Wires -->
  <text x="30" y="75" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">|q₀⟩</text>
  <line x1="70" y1="70" x2="650" y2="70" stroke="#334155" stroke-width="2" />

  <text x="30" y="165" fill="#c084fc" font-family="monospace" font-size="14" font-weight="bold">|q₁⟩</text>
  <line x1="70" y1="160" x2="650" y2="160" stroke="#334155" stroke-width="2" />

  <!-- Layer 1: Hadamard Gates H -->
  <!-- H on q0 -->
  <rect x="100" y="45" width="48" height="50" rx="8" fill="url(#gateGrad)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="124" y="75" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">H</text>

  <!-- H on q1 -->
  <rect x="100" y="135" width="48" height="50" rx="8" fill="url(#gateGrad)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="124" y="165" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">H</text>

  <!-- Layer 2: Single Qubit Phase Rotations Rz(2x_i) -->
  <!-- Rz(2x0) on q0 -->
  <rect x="175" y="45" width="85" height="50" rx="8" fill="url(#gateGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="217" y="68" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Rz(2x₀)</text>
  <text x="217" y="84" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Single Qubit</text>

  <!-- Rz(2x1) on q1 -->
  <rect x="175" y="135" width="85" height="50" rx="8" fill="url(#gateGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="217" y="158" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Rz(2x₁)</text>
  <text x="217" y="174" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Single Qubit</text>

  <!-- Layer 3: Entangling ZZ Interaction -->
  <!-- Entanglement Box Background Outline -->
  <rect x="290" y="25" width="310" height="180" rx="12" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6" />
  <text x="445" y="42" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ZZ Entanglement Interaction Layer</text>

  <!-- CNOT 1 -->
  <!-- Control on q0 -->
  <circle cx="330" cy="70" r="6" fill="#a855f7" />
  <line x1="330" y1="70" x2="330" y2="160" stroke="#a855f7" stroke-width="2" />
  <!-- Target on q1 -->
  <circle cx="330" cy="160" r="14" fill="none" stroke="#a855f7" stroke-width="2" />
  <line x1="330" y1="146" x2="330" y2="174" stroke="#a855f7" stroke-width="2" />
  <line x1="316" y1="160" x2="344" y2="160" stroke="#a855f7" stroke-width="2" />

  <!-- Central Rz rotation with ZZ angle 2(pi-x0)(pi-x1) -->
  <rect x="375" y="132" width="140" height="56" rx="8" fill="url(#zzGrad)" stroke="#a855f7" stroke-width="1.8" />
  <text x="445" y="156" fill="#f3e8ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Rz(2(π-x₀)(π-x₁))</text>
  <text x="445" y="174" fill="#d8b4fe" font-family="sans-serif" font-size="9" text-anchor="middle">Nonlinear ZZ Phase Shift</text>

  <!-- CNOT 2 (Uncoupling) -->
  <!-- Control on q0 -->
  <circle cx="560" cy="70" r="6" fill="#a855f7" />
  <line x1="560" y1="70" x2="560" y2="160" stroke="#a855f7" stroke-width="2" />
  <!-- Target on q1 -->
  <circle cx="560" cy="160" r="14" fill="none" stroke="#a855f7" stroke-width="2" />
  <line x1="560" y1="146" x2="560" y2="174" stroke="#a855f7" stroke-width="2" />
  <line x1="546" y1="160" x2="574" y2="160" stroke="#a855f7" stroke-width="2" />

  <!-- Output state indicator -->
  <text x="660" y="120" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">|Φ(x)⟩</text>
</svg>
