<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" className="w-full h-full">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="sphereGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#060913" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060913" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#glowGlow)" />

  <!-- Sphere Background -->
  <circle cx="250" cy="250" r="180" fill="url(#sphereGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Latitude / Equator Ellipse -->
  <ellipse cx="250" cy="250" rx="180" ry="55" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6" />
  <!-- Equator Front Arc -->
  <path d="M 70 250 A 180 55 0 0 0 430 250" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.85" />

  <!-- Zero-Meridian Ellipse -->
  <ellipse cx="250" cy="250" rx="60" ry="180" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.4" />

  <!-- Axis Lines -->
  <!-- Z Axis (Vertical) -->
  <line x1="250" y1="450" x2="250" y2="50" stroke="#94a3b8" stroke-width="1.8" />
  <polygon points="250,42 245,54 255,54" fill="#38bdf8" />
  <text x="250" y="32" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">|0⟩ (Z+)</text>
  <text x="250" y="475" fill="#a855f7" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">|1⟩ (Z-)</text>

  <!-- X Axis (Diagonal forward) -->
  <line x1="250" y1="250" x2="140" y2="340" stroke="#64748b" stroke-width="1.5" />
  <polygon points="135,344 140,332 148,340" fill="#64748b" />
  <text x="120" y="360" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">X (|+⟩)</text>

  <!-- Y Axis (Horizontal right) -->
  <line x1="250" y1="250" x2="435" y2="250" stroke="#64748b" stroke-width="1.5" />
  <polygon points="442,250 430,245 430,255" fill="#64748b" />
  <text x="460" y="254" fill="#94a3b8" font-family="monospace" font-size="13">Y (|i+⟩)</text>

  <!-- Projection to XY Plane -->
  <line x1="330" y1="160" x2="330" y2="270" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3" />
  <line x1="250" y1="250" x2="330" y2="270" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3" />
  <circle cx="330" cy="270" r="3" fill="#64748b" />

  <!-- Theta Arc -->
  <path d="M 250 180 A 70 70 0 0 1 285 195" fill="none" stroke="#22d3ee" stroke-width="2" />
  <text x="275" y="175" fill="#22d3ee" font-family="sans-serif" font-size="13" font-style="italic">θ = 2x₁</text>

  <!-- Phi Arc -->
  <path d="M 210 282 A 50 25 0 0 0 280 262" fill="none" stroke="#c084fc" stroke-width="2" />
  <text x="245" y="305" fill="#c084fc" font-family="sans-serif" font-size="12" font-style="italic">φ = 2x₂</text>

  <!-- State Vector Arrow |Φ(x)⟩ -->
  <line x1="250" y1="250" x2="328" y2="162" stroke="url(#cyanViolet)" stroke-width="3.5" filter="url(#glowFilter)" />
  <circle cx="330" cy="160" r="6" fill="#38bdf8" filter="url(#glowFilter)" />
  <circle cx="330" cy="160" r="2.5" fill="#ffffff" />

  <!-- State Vector Label Box -->
  <rect x="345" y="135" width="135" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.5" />
  <text x="412" y="153" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">|Φ(x)⟩</text>
  <text x="412" y="169" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Hilbert Statevector</text>

  <!-- Quantum Particle Dust Effects -->
  <circle cx="210" cy="180" r="1.5" fill="#22d3ee" opacity="0.7" />
  <circle cx="280" cy="330" r="2" fill="#a855f7" opacity="0.6" />
  <circle cx="370" cy="220" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="160" cy="220" r="2" fill="#c084fc" opacity="0.5" />
</svg>
